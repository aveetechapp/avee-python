  /chains/{chain}/tokens/{address}/verdict:
    get:
      operationId: tokenVerdict
      x-avee-cost-cu: 40
      summary: Signed token verdict, submittable to the trust oracle
      tags:
      - token
      security: []
      x-plan: anon
      x-cache-ttl: 15
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerdict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: |
        What the avee trust oracle holds for one token, signed (EIP-712) so it can be submitted to `AveeTrustOracle.submitAttestation` or carried in a Uniswap v4 `hookData`. No key, no payment: a verdict nobody can read is a verdict nobody can act on.

        Read `status` and the signature together. `ok` means the oracle holds no block — it is **not** a clearance, and it never means the token was examined and found clean. A token nobody has evaluated answers `200` with `status: "unknown"` and no signature block at all, because a signed zero would be a claim nobody made. Chains with no oracle answer the same way, with `oracle_address` absent.

        `verdict_at` is when the verdict was reached; `signed_at` is when this response was signed and is the value the signature covers. An attestation can only tighten a verdict on chain: it may raise a status or set one where none exists, never lower one the relayer wrote.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
