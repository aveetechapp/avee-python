      properties:
        slug:
          $ref: '#/components/schemas/ChainSlug'
        chain_id:
          type: integer
          format: uint32
    ChainSlug:
      type: string
      minLength: 1
      maxLength: 32
      description: chain slug. Open set — chains are added without a major version; resolve the current
        list from GET /chains.
      examples:
      - hyperliquid
      - ton
      - robinhood
    ChartCandles:
      type: object
      required:
      - s
      - t
      - o
      - h
      - l
      - c
      - v
      properties:
        s:
          description: status
          type: string
          enum:
          - ok
          - error
          - no_data
        t:
          type: array
          description: array of candle timestamps
          items:
            type: integer
            format: uint64
        o:
          type: array
          description: array of candle open-price
          items:
            type: number
        h:
          type: array
          description: array of candle high-price
          items:
            type: number
        l:
          type: array
          description: array of candle low-price
          items:
            type: number
        c:
          type: array
          description: array of candle close-price
          items:
            type: number
        v:
          description: array of volumes (value in native units)
          type: array
          items:
            type: number
        err_msg:
          type: string
          description: text of error message
    Config:
      type: object
      required:
      - chains
      - resolutions
      - tx_types
      - sort_options
      - timeframes
      - min_liquidity_usd
      description: enumerations and defaults a client needs to build valid requests
      properties:
        chains:
          type: array
          items:
            $ref: '#/components/schemas/ChainInfo'
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/ResolutionType'
        tx_types:
          type: array
          items:
            $ref: '#/components/schemas/TxType'
        sort_options:
          type: array
          items:
            $ref: '#/components/schemas/SortBy'
        timeframes:
          type: array
          items:
            $ref: '#/components/schemas/TimeFrame'
        min_liquidity_usd:
          type: number
          format: double
          description: liquidity floor below which pairs are not indexed
    DecimalString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
    DeployerReputation:
      type: object
      required:
      - score
      - status
      properties:
        score:
          description: 0..100, higher is better; 50 = no evidence
          type: integer
          format: uint32
        status:
          $ref: '#/components/schemas/DeployerStatus'
        pairs_created:
          type: integer
          format: uint32
        abused_launches:
          type: integer
          format: uint32
        first_seen_at:
          type: string
    DeployerStatus:
      type: string
      description: deployer status. Open set.
    Dex:
      type: object
      required:
      - name
      - factory
      - chain_id
      - lp_token_symbol
      properties:
        name:
          type: string
        factory:
          $ref: '#/components/schemas/Address'
        factory_type:
          $ref: '#/components/schemas/FactoryType'
        chain_id:
          type: integer
          format: uint32
        lp_token_symbol:
          type: string
    ErrorCode:
      type: string
      description: stable machine-readable error code. Closed set within a major version.
      enum:
      - invalid_api_key
      - key_in_query
      - plan_required
      - rate_limited
      - chain_not_found
      - not_found
      - invalid_param
      - upstream_unavailable
      - upstream_timeout
      - internal
    EthereumTxData:
      type: object
      required:
      - block_number
      - log_index
      - gas_used
      - fee_usd
      properties:
        block_number:
          type: integer
        log_index:
          type: integer
        gas_used:
          type: integer
        fee_usd:
          type: number
    FactoryType:
      type: string
      x-known-values: [curveV2, stonfiV1, stonfiV2, dedustV1, dedustV2, uranusV1, balancerV2, uniswapV2, uniswapV3, uniswapV4, hyperliquid]
      description: 'DEX protocol (factory) implementation. Open set — new protocols appear without a major
        version. Known values: curveV2, stonfiV1, stonfiV2, dedustV1, dedustV2, uranusV1, balancerV2,
        uniswapV2, uniswapV3, uniswapV4, hyperliquid.'
    FarmApr:
      type: object
      required:
      - base_apr
      - lp_reward_apr
      description: |
        APR decomposition, percent. `0` means the indexer reported no value, which is not the same claim as "this farm measurably yields nothing" — read a zero next to an `unverified` status as low confidence rather than as a fact.
      properties:
        base_apr:
          $ref: '#/components/schemas/DecimalString'
        lp_reward_apr:
          $ref: '#/components/schemas/DecimalString'
    FarmFactory:
      type: object
      required:
      - address
      - name
      description: the contract that deployed the farm
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
    FarmInfo:
      type: object
      required:
      - network
      - address
      - pid
      - ticker
      - tvl
      - reward_token
      - apr_year
      - apr_daily
      - updated_at
      - status
      properties:
        network:
          $ref: '#/components/schemas/ChainRef'
        address:
          $ref: '#/components/schemas/Address'
        pid:
          description: pool id inside the farm contract, as the indexer reports it
          type: integer
          format: int64
        ticker:
          description: the staked pair's label; `-` when the indexer has not resolved one
          type: string
        tvl:
          description: total value locked, USD
          $ref: '#/components/schemas/DecimalString'
        reward_token:
          $ref: '#/components/schemas/FarmRewardToken'
        apr_year:
          $ref: '#/components/schemas/FarmApr'
        apr_daily:
          $ref: '#/components/schemas/FarmApr'
        factory:
          $ref: '#/components/schemas/FarmFactory'
        updated_at:
          description: the indexer's observation time, passed through verbatim
          type: string
        status:
          $ref: '#/components/schemas/FarmStatus'
        lifecycle_state:
          description: |
            where the farm is in its life: `active`, `ended` (emission observed to have finished) or `deprecated` (no longer tracked). Deliberately not an `enum` — the indexer owns this vocabulary and adds to it, and a generated client that validates responses would reject a whole page over one row carrying a member it has not been regenerated for. Absent means the indexer reported no lifecycle for this row, not that the farm is active.
          type: string
        data_quality_flags:
          description: |
            what the indexer could not stand behind on this row. An open set — current members are `no_apr` (liquidity below the floor at which an APR is meaningful, so none was computed), `stale` and `illiquid_reward`. This is what separates "we did not measure a yield" from "this farm pays nothing": both arrive as an APR of `0`, and only the flag tells them apart. Absent means no flags were reported, which is not a claim that the row is clean.
          type: array
          items:
            type: string
    FarmPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FarmInfo'
        next_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` for the next page; absent on the last page
        prev_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` to walk back; absent at the start and on every merged page
    FarmRewardToken:
      type: object
      required:
      - address
      - name
      - symbol
      - chain_id
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
        symbol:
          type: string
        chain_id:
          type: integer
          format: uint32
    FarmSortBy:
      type: string
      default: tvl
      enum:
      - tvl
      - apr
      - updated_at
    FarmStatus:
      type: string
      description: whether the farm contract has been verified
      enum:
      - unverified
      - verified
    FloatTimeframes:
      type: object
      required:
      - m5
      - h1
      - h6
      - h24
      properties:
        m5:
          type: number
          format: float64
        h1:
          type: number
          format: float64
        h6:
          type: number
          format: float64
        h24:
          type: number
          format: float64
    KeyInfo:
      type: object
      required:
      - name
      - plan
      - rate_limit
      properties:
        name:
          type: string
          description: key label; never the key itself
        plan:
          $ref: '#/components/schemas/Plan'
        rate_limit:
          type: object
          required:
          - requests_per_second
          - burst
          properties:
            requests_per_second:
              type: integer
              format: int32
            burst:
              type: integer
              format: int32
            max_concurrent_requests:
              type: integer
              format: int32
        max_limit:
          type: integer
          format: int32
          description: largest page size this plan may request
    LiquidityEventData:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/LiquidityTokenChange'
        liquidity_usd:
          type: number
          format: float
    LiquidityTokenChange:
      type: object
      required:
      - address
      - amount
      - price_usd
      properties:
        address:
          $ref: '#/components/schemas/Address'
        symbol:
          type: string
        amount:
          type: number
          format: float64
        price_usd:
          type: number
          format: float64
    MarketType:
      type: string
      description: |
        market filter; perp markets exist only on Hyperliquid, on every other chain `spot` and `any` are equivalent
      enum:
      - any
      - spot
      - perp
      default: any
    NonNegativeDecimalString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
    OrderBy:
      type: string
      default: desc
      enum:
      - asc
      - desc
    PairDeployer:
      type: object
      required:
      - address
      properties:
        address:
          $ref: '#/components/schemas/Address'
        tx_hash:
          type: string
        block_number:
          type: integer
          format: uint32
        log_index:
          type: integer
          format: uint32
        reputation:
          $ref: '#/components/schemas/DeployerReputation'
    PairInfo:
      type: object
      required:
      - network
      - dex
      - pair_address
      - ticker
      - pair_fee
      - tokens
      - txn
      - volume
      - price_change
      - liquidity_usd
      - last_updated_at
      - created_at
      properties:
        network:
          $ref: '#/components/schemas/ChainRef'
        dex:
          $ref: '#/components/schemas/Dex'
        pair_address:
          $ref: '#/components/schemas/Address'
        prop_data:
          $ref: '#/components/schemas/PairPropData'
        status:
          $ref: '#/components/schemas/PairStatus'
        score:
          $ref: '#/components/schemas/PairScore'
        deployer:
          description: pair creation context; absent when unknown
          $ref: '#/components/schemas/PairDeployer'
        security:
          description: |
            LP lock and burn. Absent from list responses: the index the screener reads does not join the lock table, so a list row carries no lock figure at all rather than a zero that would read as "nothing locked". Read the single-pair operation for it.
          $ref: '#/components/schemas/PairSecurity'
        verdict:
          description: |
            block state of this pair, on every row including list responses — screen without a second call per pool.
          $ref: '#/components/schemas/PairVerdict'
        ticker:
          type: string
          minLength: 1
        pair_fee:
          description: swap fee this pair charges, as a fraction (0.003 = 0.3%); not a network/gas fee
          type: number
          format: float64
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        txn:
          $ref: '#/components/schemas/TxnTimeframes'
        volume:
          $ref: '#/components/schemas/FloatTimeframes'
        price_change:
          $ref: '#/components/schemas/FloatTimeframes'
        liquidity_usd:
          type: number
          format: float64
        liquidity_onchain_usd:
          type: number
          format: float64
        apr:
          description: |
            LP fee yield in percent per year: `fees_usd_24h * 365 / liquidity_onchain_usd * 100`. A pool-level, full-range-equivalent figure, the same base yield the venues publish. Absent when the pair has no APR — a terminal status, a low score, a perpetual, wash-flagged, a pool under the dust floor, or no fee revenue in the window.
          type: number
          format: float64
        fees_usd_24h:
          description: LP fee revenue over the last 24 hours, the numerator `apr` was annualised from
          type: number
          format: float64
        last_updated_at:
          type: string
        created_at:
          type: string
        last_trade_at:
          description: the last swap the indexer saw, RFC 3339 UTC; absent when none was recorded
          type: string
        price_native:
          description: the base token's price in the quote token
          type: number
          format: double
        windows:
          $ref: '#/components/schemas/PairWindows'
        launchpad:
          $ref: '#/components/schemas/PairLaunchpad'
        safety:
          $ref: '#/components/schemas/PairSafety'
    PairPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PairInfo'
        next_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` for the next page; absent on the last page
        prev_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` to walk back; absent at the start
        applied_sort:
          description: |
            the sort actually applied. The composite boards define their own key, so a board asked for with a `timeframe` reports here what it really ranked by rather than echoing the request.
          $ref: '#/components/schemas/SortBy'
        applied_timeframe:
          description: |
            the window the applied sort read. Absent when the applied sort reads no window.
          $ref: '#/components/schemas/TimeFrame'
        excluded_chains:
          description: |
            chains dropped from a ranked page because their metrics pipeline is stale, so a ranking over them would be a ranking over figures nobody refreshed. Present only when the applied sort is a metric or board sort. Empty means nothing was dropped; a chain named here is served, just not ranked — read it rather than concluding from a missing row that the chain has no pairs.
          type: array
          items:
            $ref: '#/components/schemas/ChainSlug'
    PairPropData:
      type: object
      properties:
        is_perp:
          type: boolean
          default: false
        is_honeypot:
          type: boolean
          default: false
        spot_disabled:
          type: boolean
          default: false
        perp_disabled:
          type: boolean
          default: false
        buy_tax:
          description: buy tax percent (0..100); 0 when unchecked
          type: number
          format: float64
        sell_tax:
          description: sell tax percent (0..100); 0 when unchecked
          type: number
          format: float64
        liquidity_range:
          description: |
            lowest and highest `liquidity_usd` observed for this pair. Absent until the first observation — the chain's own history cannot be replayed, so the range starts the moment the pair first qualified and never covers anything earlier.
          $ref: '#/components/schemas/ValueRange'
        perp:
          description: |
            perpetual contract terms. Only ever present when `is_perp` is true.
          $ref: '#/components/schemas/PerpMarket'
    PairScore:
      type: object
      required:
      - value
      - title
      properties:
        value:
          description: 0..100 quality grade
          type: integer
          format: uint32
        title:
          description: human band label
          type: string
        updated_at:
          type: string
        risk_signals:
          type: array
          items:
            $ref: '#/components/schemas/RiskSignal'
    PairSecurity:
      type: object
      required:
      - burned_pct
      - locked_pct
      properties:
        burned_pct:
          description: '% of LP supply burned (0..100)'
          type: number
          format: float64
        locked_pct:
          description: '% of LP supply locked in a known locker (0..100)'
          type: number
          format: float64
        top_lock_provider:
          type: string
        earliest_unlock_at:
          type: string
        checked_at:
          type: string
    PairStatus:
      type: string
      x-known-values: [active, verified, unresolved, scam]
      description: |
        pair lifecycle grade. Open set. Known values: active, verified, unresolved, scam. `unresolved` and `scam` are terminal — they end every activity with the pair, and `unresolved` was never an accusation, only metadata that never resolved.
    PairVerdict:
      description: |
        the block state of a pair, unsigned. `blocked` means a terminal status on the pair or on either of its tokens; `ok` means nothing is recorded against it, and is not a clearance. This is the same state the oracle signs — the signed, submittable object for one token is `GET /chains/{chain}/tokens/{address}/verdict`.
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/VerdictStatus'
    PerpMarket:
      description: |
        What a perpetual has instead of a pool. There is no reserve, no supply and no liquidity behind a perp, so `liquidity_usd` is 0 by construction and `open_interest_usd` is the figure that answers the same question — how much capital is committed to this market.

        Volume is notional (price x size) exactly as on spot: leverage moves the margin a trader posts, never the size that prints on the tape, so perp volume is **not** multiplied by leverage and the `volume` / `txn` blocks stay directly comparable with a spot pair.

        Every field is a snapshot of the venue's info endpoint taken at `synced_at`, not a streamed value, so mark and open interest lag the trade feed by up to one polling interval.
      type: object
      properties:
        max_leverage:
          description: highest leverage the venue allows on this market
          type: integer
          format: uint32
        only_isolated:
          description: cross margin is not offered here
          type: boolean
          default: false
        funding_rate:
          description: funding paid per hour as a fraction; positive means longs pay shorts
          type: number
          format: float64
        open_interest:
          description: open contracts in base units
          type: number
          format: float64
        open_interest_usd:
          description: open_interest valued at mark
          type: number
          format: float64
        mark_price:
          type: number
          format: float64
        oracle_price:
          type: number
          format: float64
        premium:
          description: mark over oracle as a fraction; the pressure funding is settling
          type: number
          format: float64
        day_notional_volume:
          description: venue-reported 24h notional, independent of our own candles
          type: number
          format: float64
        synced_at:
          description: when the venue was last polled, UTC
          type: string
    PaymentRequired:
      description: |
        the x402 challenge, sent as the `402` body and, base64-encoded, in the `PAYMENT-REQUIRED` header. Fields are camelCase because that is the x402 wire format, not this API's convention.
      type: object
      required:
      - x402Version
      - accepts
      properties:
        x402Version:
          type: integer
          format: int32
        error:
          description: why this request was challenged
          type: string
        accepts:
          description: the ways to pay; each entry is one scheme on one network
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequirements'
        resource:
          $ref: '#/components/schemas/PaymentResource'
        extensions:
          description: x402 extensions by name, such as `bazaar` and `payment-identifier`
          type: object
          additionalProperties: true
    PaymentRequirements:
      type: object
      required:
      - scheme
      - network
      - amount
      - asset
      - payTo
      - maxAmountRequired
      - maxTimeoutSeconds
      properties:
        scheme:
          description: '`exact` is the only scheme served'
          type: string
        network:
          type: string
        amount:
          description: price in the asset's smallest unit
          type: string
        asset:
          description: token contract to pay in
          type: string
        payTo:
          type: string
        maxAmountRequired:
          type: string
        resource:
          type: string
        description:
          type: string
        mimeType:
          type: string
        maxTimeoutSeconds:
          type: integer
          format: int32
        extra:
          description: scheme-specific fields; for `exact`, the EIP-712 domain of the asset
          type: object
          additionalProperties: true
    PaymentResource:
      type: object
      required:
      - url
      properties:
        url:
          type: string
        description:
          type: string
        mimeType:
          type: string
        serviceName:
          type: string
    X402Discovery:
      type: object
      description: operations payable with x402, in the x402 discovery shape
      required:
      - x402Version
      - resources
      - items
      properties:
        x402Version:
          type: integer
          format: int32
        resources:
          description: the URL of every payable operation; path parameters stay as `{name}`
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/X402DiscoveredResource'
    X402DiscoveredResource:
      type: object
      required:
      - resource
      - type
      - x402Version
      - accepts
      - lastUpdated
      properties:
        resource:
          type: string
        type:
          description: '`http` for every operation of this API'
          type: string
        x402Version:
          type: integer
          format: int32
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequirements'
        extensions:
          description: the `bazaar` input and output description, and `payment-identifier`
          type: object
          additionalProperties: true
        lastUpdated:
          type: string
          format: date-time
    Plan:
