          format: uri
        market:
          $ref: '#/components/schemas/TokenMarketProjection'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/TokenInstance'
        chain:
          description: the deployment this market-list row describes
          $ref: '#/components/schemas/ChainRef'
        address:
          type: string
          description: the deployment address of a market-list row
        decimals:
          type: integer
          format: uint32
        score:
          type: integer
          format: uint32
          minimum: 0
          maximum: 100
          description: the token trust score
        categories:
          type: array
          description: category slugs. Open set; empty when no category is known as a fact
          items:
            type: string
        price_usd:
          type: number
          format: double
        price_change_1h:
          type: number
          format: double
          description: percent; absent when unknown
        price_change_6h:
          type: number
          format: double
          description: percent; absent when unknown
        price_change_24h:
          type: number
          format: double
          description: percent; absent when unknown
        volume_24h:
          type: number
          format: double
        txns_24h:
          type: integer
          format: uint32
        liquidity_usd:
          type: number
          format: double
        pairs_count:
          type: integer
          format: uint32
        fdv_usd:
          type: number
          format: double
        market_cap_usd:
          type: number
          format: double
        market_cap_estimated:
          type: boolean
          description: true when no circulating supply is known and `market_cap_usd` is the FDV
        total_supply:
          type: number
          format: double
        max_supply:
          type: number
          format: double
          description: absent when unknown
        circulating_supply:
          type: number
          format: double
          description: absent when unknown
        holders:
          type: integer
          format: uint32
          description: holders we track; absent when unknown
        launched_at:
          type: string
          description: RFC 3339 UTC; absent when unknown
        rating:
          $ref: '#/components/schemas/TokenRating'
        main_pair:
          $ref: '#/components/schemas/TokenMainPair'
        launch:
          $ref: '#/components/schemas/TokenLaunch'
        windows:
          $ref: '#/components/schemas/TokenWindows'
        holder_stats:
          $ref: '#/components/schemas/TokenHolderStats'
        profile:
          $ref: '#/components/schemas/TokenProfile'
    TokenLaunch:
      type: object
      description: the contract creation record; absent when it was never observed
      required:
