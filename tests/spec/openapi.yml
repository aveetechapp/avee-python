components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued by avee. Header only — a key in the query string is rejected.
  parameters:
    AcceptPayment:
      name: Accept-Payment
      in: header
      required: false
      description: |
        payment methods the client can use, comma-separated, case-insensitive. With `x402` in the list, a spent keyless budget answers `402` with the x402 challenge instead of `429`.
      schema:
        type: string
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      description: |
        base64 x402 v2 payment payload for this request. A paid request skips the keyless budget and is settled only when it answers `2xx`. The v1 header `X-PAYMENT` is accepted too.
      schema:
        type: string
  responses:
    BadRequest:
      description: invalid parameter, body or a key sent in the query string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: an API key was sent but is malformed, unknown or revoked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: the key plan does not include this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: unknown chain, pair, token or wallet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentRequired:
      description: >
        a keyless caller asked to pay (`Accept-Payment: x402`) once its budget was spent, or sent a
        payment that was refused or could not be settled. The x402 requirements are in the
        `PAYMENT-REQUIRED` header and in the body; the body alone adds the `bazaar` description of
        the operation. Pay, then repeat the request with `PAYMENT-SIGNATURE`; the settlement receipt
        comes back in `PAYMENT-RESPONSE`. A payment identifier reused for a different request is `409`.
      headers:
        PAYMENT-REQUIRED:
          description: |
            base64 of the x402 v2 PaymentRequired document in the body, without the `bazaar` extension so the header stays within proxy limits
          schema:
            type: string
        PAYMENT-RESPONSE:
          description: base64 x402 settlement response, present when a settlement failed
          schema:
            type: string
        Retry-After:
          description: seconds until the keyless budget allows another free call
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequired'
    TooManyRequests:
      description: plan rate limit or concurrency cap exceeded; retry after `Retry-After` seconds
      headers:
        PAYMENT-REQUIRED:
          description: |
            base64 x402 v2 payment requirements, present when the keyless budget is spent and the call can be paid for instead of waiting. Repeat the request with `PAYMENT-SIGNATURE`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: an upstream data service is unavailable; safe to retry
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: unexpected server error; quote `request_id` to support
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TxnCount:
      type: object
      required:
      - buys
      - sells
      properties:
        buys:
          type: integer
          format: uint32
        sells:
          type: integer
          format: uint32
    PairWindow:
      type: object
      description: one trailing window of a pair's tape
      required:
      - volume_usd
      - buy_volume_usd
      - sell_volume_usd
      - txns
      - buyers
      - sellers
      properties:
        price_change_pct:
          description: percent; absent when no trustworthy price anchors the window, which is not a flat market
          type: number
          format: double
        volume_usd:
          type: number
          format: double
        buy_volume_usd:
          type: number
          format: double
        sell_volume_usd:
          type: number
          format: double
        txns:
          $ref: '#/components/schemas/TxnCount'
        buyers:
          description: distinct wallets that bought
          type: integer
          format: uint32
        sellers:
          description: distinct wallets that sold
          type: integer
          format: uint32
    PairWindows:
      type: object
      description: the trailing windows measured for this pair; a window not measured is absent. Open set of keys.
      properties:
        m5:
          $ref: '#/components/schemas/PairWindow'
        h1:
          $ref: '#/components/schemas/PairWindow'
        h6:
          $ref: '#/components/schemas/PairWindow'
        h24:
          $ref: '#/components/schemas/PairWindow'
    PerpSortBy:
      type: string
      default: volume
      enum:
      - volume
      - transactions
      - price_change
      - trending
      - created_at
    LaunchStatus:
      type: string
      default: new
      enum:
      - new
      - bonding
      - graduated
    PairLaunchpad:
      type: object
      description: |
        the launch this pool belongs to; absent for a pool no launchpad created. `stage` is `bonding` while a bonding curve has not completed, `graduated` once it migrated, and `launched` for a launchpad pool with no curve (a hook or a direct pool).
      required:
      - name
      - stage
      properties:
        name:
          description: the launchpad, or the curve venue when no brand is attributed
          type: string
        protocol:
          description: the protocol the pool runs on
          type: string
        stage:
          description: 'Open set. Known values: launched, bonding, graduated.'
          type: string
        completed_at:
          description: when the curve graduated, RFC 3339 UTC
          type: string
        migrated_pool:
          description: the pool the curve migrated its liquidity to
          $ref: '#/components/schemas/Address'
    PairSafety:
      type: object
      description: |
        the pool's risk facts in one place, lighter than `/brief`. An absent field was not measured; `false` and `0` are measured values.
      required:
      - is_honeypot
      - score
      - labels
      properties:
        is_honeypot:
          type: boolean
        buy_tax:
          description: percent (0..100); absent when both taxes read 0, because an unchecked pool also reads 0
          type: number
          format: double
        sell_tax:
          description: percent (0..100); absent when both taxes read 0, because an unchecked pool also reads 0
          type: number
          format: double
        lp_locked_pct:
          description: '% of LP supply locked; single-pair reads only, like `security`'
          type: number
          format: double
        lp_burned_pct:
          description: '% of LP supply burned; single-pair reads only'
          type: number
          format: double
        score:
          description: 0..100 quality grade
          type: integer
          format: uint32
        labels:
          description: the risk signal kinds recorded against the pool
          type: array
          items:
            $ref: '#/components/schemas/RiskSignalKind'
    TokenWindow:
      type: object
      description: one trailing window of a token, summed over the pools that count toward it
      required:
      - volume_usd
      - buy_volume_usd
      - sell_volume_usd
      - txns
      - buyers
      - sellers
      - makers
      - makers_main_pair_only
      properties:
        price_change_pct:
          description: percent, read on the main pair; absent when unknown
          type: number
          format: double
        volume_usd:
          type: number
          format: double
        buy_volume_usd:
          type: number
          format: double
        sell_volume_usd:
          type: number
          format: double
        txns:
          $ref: '#/components/schemas/TxnCount'
        buyers:
          type: integer
          format: uint32
        sellers:
          type: integer
          format: uint32
        makers:
          type: integer
          format: uint32
        makers_main_pair_only:
          description: |
            true when `buyers`, `sellers` and `makers` count the main pair only. Distinct wallets cannot be added across pools, so these three never cover every pool.
          type: boolean
    TokenWindows:
      type: object
      description: the trailing windows measured for this token; a window not measured is absent. Open set of keys.
      properties:
        m5:
          $ref: '#/components/schemas/TokenWindow'
        h1:
          $ref: '#/components/schemas/TokenWindow'
        h6:
          $ref: '#/components/schemas/TokenWindow'
        h24:
          $ref: '#/components/schemas/TokenWindow'
    TokenHolderStats:
