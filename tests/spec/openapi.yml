          format: int64
          minimum: 0
        transactions:
          type: integer
          format: int64
          minimum: 0
    TokenPage:
      type: object
      required:
      - items
      - includes
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
        next_cursor:
          type: string
          maxLength: 512
