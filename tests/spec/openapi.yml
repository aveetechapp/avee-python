      - can_be_seized
      - exit_is_taxed
      - liquidity_can_leave
      - operator_record
      - unverified
    RiskSignalSeverity:
      type: string
      description: how the signal ranks inside its group; a group shows the highest severity present
        in it
      enum:
      - critical
      - warning
      - info
    RiskSignalKind:
      type: string
      description: risk signal kind. Open set.
    SearchPair:
