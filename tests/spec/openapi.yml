      - price_usd1
      properties:
        amount0:
          type: number
          format: float64
        amount1:
          type: number
          format: float64
        price0:
          type: number
          format: float64
        price1:
          type: number
          format: float64
        price_usd0:
          type: number
          format: float64
        price_usd1:
          type: number
          format: float64
    TimeFrame:
      type: string
