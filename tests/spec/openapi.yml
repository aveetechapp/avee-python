# Source of truth for internal/pkg/rest-v3 (make generate-ogen-v3) and for the docs site.
openapi: 3.1.0
info:
  title: avee
  version: 1.0.0
  summary: DEX market data for machines
  description: |
    Read-only market data for decentralised exchanges: liquidity pairs, canonical tokens, trades and
    OHLCV candles across every chain avee indexes.

    ## Authentication

    No key is required: every operation in this document answers an unauthenticated request. A key
    only raises the limits. It travels in the `X-API-Key` header (`Authorization: Bearer <key>` is
    accepted too); a key that is sent but unknown or revoked is `401`, never a quiet downgrade, and a
    key in the query string is rejected with `400 key_in_query` because query strings end up in proxy
    logs and browser history.

    ## Errors

    Every non-2xx response is `application/problem+json` (RFC 9457) carrying a stable `code`, a
    human-readable `detail` and the `request_id` to quote to support. Branch on `code`, never on
    `detail`.

    ## Rate limits

    Without a key, one budget is shared per client address across every operation, and each call
    spends its operation's `x-avee-cost-cu` against it: wallet analytics and batches drain it
    faster than a pair lookup. An IPv6 address counts by its `/64`. With a key, limits are per key and per operation and always at least
    the keyless ones. Every limited response carries `RateLimit-Policy` and `RateLimit`
    (IETF draft-ietf-httpapi-ratelimit-headers) alongside the legacy `X-RateLimit-Limit` and
    `X-RateLimit-Remaining`; a `429` also carries `Retry-After` in seconds. `GET /key` reports the
    limits of the calling key.

    ## Paying past the keyless limit

    Where x402 is switched on, a keyless caller whose budget is spent can pay per call instead of
    waiting. The `429` then also carries `PAYMENT-REQUIRED`: base64 x402 v2 payment requirements. A
    client that sends `Accept-Payment: x402` gets the same requirements as a `402` instead, with the
    document in the body too. Repeat the request with `PAYMENT-SIGNATURE`: a paid request skips the
    keyless budget and is settled only when it answers `2xx`; the receipt is in `PAYMENT-RESPONSE`.
    The price follows `x-avee-cost-cu`, and `GET /.well-known/x402` lists every payable operation.

    ## Pagination

    Lists return `{items, next_cursor, prev_cursor}`. Cursors are opaque: pass them back unchanged and
    stop when `next_cursor` is absent. Never build a cursor yourself.

    ## Chains

    Chain identity is a slug (`ton`) or a numeric id (`950000`); both are accepted wherever a chain is
    named, and every chain-scoped object carries both. The set of chains is open and grows without a
    major version — read `GET /chains` instead of hardcoding a list.

    ## Compatibility

    Within v1 only additive changes ship: new endpoints, new optional parameters, new response fields,
    new values in the open sets marked in this document. Tolerate unknown enum values and unknown JSON
    fields. A breaking change means v2, and v1 keeps serving for at least 12 months after v2 is
    generally available, announced by `Deprecation` and `Sunset` response headers.

    ## Two endpoints outside this document

    `GET /api/v1/openapi.yml` returns this specification and `GET /api/v1/llms.txt` an agent-readable index of
    it. Both are rate limited like any other route.
  contact:
    name: avee
    url: https://docs.avee.tech
    email: connect@avee.tech
servers:
- url: https://api.preview.avee.tech/api/v1
  description: preview — the next release, listed first because it serves this contract today
- url: https://api.avee.tech/api/v1
  description: production
security: []
tags:
- name: meta
  description: health, plan, enumerations and the chain roster
- name: dex
  description: liquidity pairs, trades and candles
- name: token
  description: the canonical token registry
- name: farm
  description: yield farms and their APR
- name: wallet
  description: traders, their positions and the chain and protocol boards
- name: oracle
  description: prices from the avee oracle
paths:
  /.well-known/x402:
    get:
      operationId: x402Discovery
      x-avee-cost-cu: 0
      summary: Operations payable with x402 and their prices
      tags:
      - meta
      x-plan: anon
      x-cache-ttl: 60
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402Discovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: 'Every operation a keyless caller can pay for once its budget is spent, with the
        networks, assets and atomic amounts it accepts, in the x402 discovery shape. Empty where x402
        is switched off. Fields are camelCase because that is the x402 wire format.'
  /status:
    get:
      operationId: status
      x-avee-cost-cu: 0
      summary: Liveness and upstream health
      tags:
      - meta
      x-plan: anon
      x-cache-ttl: 0
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: 'Reports `ok` when every upstream this API depends on is reachable, `degraded` otherwise.
        Cheap: it spends the smallest unit of a rate limit.'
  /key:
    get:
      operationId: key
      x-avee-cost-cu: 0
      summary: Plan and limits of the calling key
      tags:
      - meta
      x-plan: anon
      x-cache-ttl: 0
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: 'Returns the plan, rate limit and page-size ceiling of the key making the request.
        Never returns the key itself. Without a key it answers `401`.'
  /config:
    get:
      operationId: config
      x-avee-cost-cu: 10
      summary: Enumerations and defaults
      tags:
      - meta
      x-plan: anon
      x-cache-ttl: 30
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: 'Everything a client needs to build a valid request: live chains, chart resolutions,
        transaction types, sort options and the indexing liquidity floor.'
      parameters:
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains:
    get:
      operationId: chains
      x-avee-cost-cu: 10
      summary: Chains served right now
      tags:
      - meta
      x-plan: anon
      x-cache-ttl: 30
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: Only chains that produced a block within the last 24 hours. A chain missing here is
        not indexed at the moment; do not hardcode this list.
      parameters:
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /search:
    get:
      operationId: search
      x-avee-cost-cu: 30
      summary: Typeahead across tokens and pairs
      tags:
      - dex
      x-plan: anon
      x-cache-ttl: 3
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: Matches token symbols and pair tickers. Address lookups are exact.
      parameters:
      - name: q
        in: query
        required: true
        description: symbol, ticker or address
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: chains
        in: query
        required: false
        description: comma-separated chain slugs or ids; omit for every live chain
        schema:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ChainSlug'
        style: form
        explode: false
      - name: limit
        in: query
        required: false
        description: maximum hits per kind
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 8
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /pairs:
    get:
      operationId: pairs
      x-avee-cost-cu: 30
      summary: Liquidity pair screener
      tags:
      - dex
      x-plan: anon
      x-cache-ttl: 2
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: The screener. Filters compose with AND. Sorting by a metric reads the window given
        by `timeframe`; the composite boards (`popular`, `hottest`, `trending`) define their own and ignore
        it.
      parameters:
      - name: chains
        in: query
        required: false
        description: comma-separated chain slugs or ids; omit for every live chain
        schema:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ChainSlug'
        style: form
        explode: false
      - name: q
        in: query
        required: false
        description: ticker or DEX name substring
        schema:
          type: string
          maxLength: 128
      - name: protocols
        in: query
        required: false
        description: comma-separated DEX protocols
        schema:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/FactoryType'
        style: form
        explode: false
      - name: dex_names
        in: query
        required: false
        description: comma-separated DEX names
        schema:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        style: form
        explode: false
      - name: min_liquidity_usd
        in: query
        required: false
        description: inclusive lower bound on quoted liquidity
        schema:
          type: number
          format: double
          minimum: 0
      - name: max_liquidity_usd
        in: query
        required: false
        description: inclusive upper bound on quoted liquidity
        schema:
          type: number
          format: double
          minimum: 0
      - name: min_apr
        in: query
        required: false
        description: inclusive lower bound on LP fee APR, percent per year
        schema:
          type: number
          format: double
      - name: max_apr
        in: query
        required: false
        description: inclusive upper bound on LP fee APR, percent per year
        schema:
          type: number
          format: double
      - name: min_score
        in: query
        required: false
        description: inclusive lower bound on the trust score
        schema:
          type: integer
          format: uint32
          minimum: 0
          maximum: 100
      - name: max_score
        in: query
        required: false
        description: inclusive upper bound on the trust score
        schema:
          type: integer
          format: uint32
          minimum: 0
          maximum: 100
      - name: min_age_seconds
        in: query
        required: false
        description: exclude pairs younger than this
        schema:
          type: integer
          format: uint32
          minimum: 0
      - name: max_age_seconds
        in: query
        required: false
        description: exclude pairs older than this; the way to ask for new pairs
        schema:
          type: integer
          format: uint32
          minimum: 0
      - name: market_type
        in: query
        required: false
        description: spot or perp; perp markets exist only on Hyperliquid
        schema:
          $ref: '#/components/schemas/MarketType'
      - name: only_trustable
        in: query
        required: false
        description: exclude pairs whose pair or tokens carry a terminal scam status
        schema:
          type: boolean
          default: false
      - name: max_deployed_pairs
        in: query
        required: false
        description: exclude pairs whose deployer has launched more than this many pairs
        schema:
          type: integer
          format: uint32
          minimum: 1
      - name: sort
        in: query
        required: false
        description: sort key
        schema:
          $ref: '#/components/schemas/SortBy'
      - name: order
        in: query
        required: false
        description: sort direction
        schema:
          $ref: '#/components/schemas/OrderBy'
      - name: timeframe
        in: query
        required: false
        description: window for metric sorts (volume, transactions, price_change)
        schema:
          $ref: '#/components/schemas/TimeFrame'
      - name: limit
        in: query
        required: false
        description: page size; plans above startup may raise the ceiling
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      - name: cursor
        in: query
        required: false
        description: opaque cursor from `next_cursor` or `prev_cursor`
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains/{chain}/pairs/{address}:
    get:
      operationId: pair
      x-avee-cost-cu: 20
      summary: One liquidity pair
      tags:
      - dex
      x-plan: anon
      x-cache-ttl: 2
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: Full metrics for a single pair, including LP security and deployer context that list
        responses omit.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains/{chain}/pairs/{address}/trades:
    get:
      operationId: pairTrades
      x-avee-cost-cu: 40
      summary: Trade tape of a pair
      tags:
      - dex
      x-plan: anon
      x-cache-ttl: 1
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: Swaps and liquidity events in time order. Walk `next_cursor` to page away from the
        newest, `prev_cursor` to catch up.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
      - name: tx_type
        in: query
        required: false
        description: comma-separated transaction types; omit for every type
        schema:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/TxType'
        style: form
        explode: false
      - name: maker
        in: query
        required: false
        description: restrict to one maker wallet
        schema:
          $ref: '#/components/schemas/Address'
      - name: from
        in: query
        required: false
        description: unix seconds, inclusive lower bound
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: to
        in: query
        required: false
        description: unix seconds, inclusive upper bound
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: order
        in: query
        required: false
        description: newest first (`desc`, default) or oldest first
        schema:
          $ref: '#/components/schemas/OrderBy'
      - name: limit
        in: query
        required: false
        description: page size; plans above startup may raise the ceiling
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      - name: cursor
        in: query
        required: false
        description: opaque cursor from `next_cursor` or `prev_cursor`
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains/{chain}/pairs/{address}/candles:
    get:
      operationId: pairCandles
      x-avee-cost-cu: 60
      summary: OHLCV candles
      tags:
      - dex
      x-plan: anon
      x-cache-ttl: 5
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartCandles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: TradingView-compatible arrays. `s` is `no_data` when the range holds no trades, which
        is a success, not an error.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
      - name: res
        in: query
        required: true
        description: candle resolution
        schema:
          $ref: '#/components/schemas/ResolutionType'
      - name: from
        in: query
        required: true
        description: unix seconds, inclusive
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: to
        in: query
        required: true
        description: unix seconds, inclusive
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: countback
        in: query
        required: false
        description: return exactly this many candles ending at `to`, ignoring `from`
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 5000
      - name: currency
        in: query
        required: false
        description: denomination of prices
        schema:
          type: string
          enum:
          - usd
          - native
          default: usd
      - name: price_from_quote
        in: query
        required: false
        description: derive price from the quote token instead of the base
        schema:
          type: boolean
          default: false
      - name: volume_from_quote
        in: query
        required: false
        description: |
          derive volume from the quote token instead of the base. Note for anyone porting from v2, where this defaulted to `true`: here it defaults to `false`, so the same call returns volume in base-token units rather than quote. Send it explicitly and the two versions agree.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains/{chain}/tokens/{address}:
    get:
      operationId: tokenByAddress
      x-avee-cost-cu: 20
      summary: Canonical token by chain and address
      tags:
      - token
      x-plan: anon
      x-cache-ttl: 0
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: 'Resolves a deployment address to the canonical token it belongs to. Responses are
        `no-store`: prices move faster than any cache would.'
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
      - name: include_instances
        in: query
        required: false
        description: include every chain deployment of this token
        schema:
          type: boolean
          default: true
      - name: include_market
        in: query
        required: false
        description: include price and market metrics
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
  /chains/{chain}/tokens/{address}/pairs:
    get:
      operationId: tokenPairs
      x-avee-cost-cu: 30
      summary: Top pairs of a token by 24h volume
      tags:
      - token
      x-plan: anon
      x-cache-ttl: 2
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
