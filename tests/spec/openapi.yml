  /chains/{chain}/tokens/{address}/brief:
    get:
      operationId: tokenBrief
      x-avee-cost-cu: 20
      summary: Everything needed to decide about a token, in one call
      tags:
      - token
      x-plan: anon
      x-cache-ttl: 15
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBrief'
        '304':
          description: the brief is unchanged since the `ETag` in `If-None-Match`; no body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: |
        One document instead of six calls: the signed verdict, the trust score with the signals that made it, both liquidity figures with lock and burn, the 24-hour market on the deepest pool, holder concentration, the deployer's history and the flags. Fields arrive in a fixed order — `verdict` is early enough to decide on before the body finishes — and empty blocks are omitted rather than sent as null, because a null invites a reader to treat "not measured" as a measured zero.

        A real token's brief is under two kilobytes. Poll it with `If-None-Match`: an unchanged token answers `304` and costs neither payment nor context.

        A keyless caller past its budget can pay per call with x402, as on every priced operation; a caller with an API key is never challenged. The embedded verdict is the verdict endpoint's object unchanged, so a chain with no oracle carries `status: "unknown"` and no signature here too.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: address
        in: path
        required: true
        description: chain-native address; EVM addresses are case-insensitive
        schema:
          $ref: '#/components/schemas/Address'
      - name: If-None-Match
        in: header
        required: false
        description: |
          the `ETag` of the brief you already hold. An unchanged token answers `304` with no body, and costs neither payment nor context. This is the intended way to poll.
        schema:
          type: string
          maxLength: 128
