          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: |
        The audit path, and the companion to the verdict. It answers "what did avee commit to at epoch N", never "is this token blocked now" — for that, read the verdict, or `isBlocked` on the oracle contract. Verify the returned path with `AveeTrustOracle.verifyLeaf(epoch, token, verdict, proof)`.

        No key, for the same reason the verdict needs none: a commitment nobody can check is not a commitment. A token absent from the published epoch is `404` — it was not committed to, which is a different fact from being committed to as unblocked.
      parameters:
      - name: chain
        in: path
        required: true
        description: chain slug (`ton`) or numeric chain id (`950000`)
        schema:
          type: string
          minLength: 1
