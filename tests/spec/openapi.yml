    get:
      operationId: leaderboard
      x-avee-cost-cu: 20
      summary: Chain and DEX protocol boards
      tags:
      - wallet
      x-plan: anon
      x-cache-ttl: 60
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
      description: |
        Precomputed rankings of the chains we index, and of the venues inside one chain. Every row carries its raw metrics beside its dimension scores, so a client can sort on any figure and ignore the composite entirely.

        `scope=protocols` is one board of DEXes and launchpads together. Every pair counts in exactly one row: the launchpad it was created on when it has one, otherwise the DEX that owns its factory. A launchpad trading on Uniswap pools is its own row, and its volume is never part of Uniswap's. `category` labels each row (`dex`, `launchpad`, `perps`, `aggregator`), `infra` names the protocols its pools trade on, and `metrics.hosted_volume_24h` shows the volume other venues trade on a row's pools without ranking it. Pools no one can name — including v4 pools under a hook with no known brand — stay out of the rows and inside the share denominator, so the named shares fall short of one by exactly that amount.

        Nothing here is computed on the request: the response is drawn from a snapshot taken on a fixed cadence, and `snapshot_at` says exactly how old it is. Rows the board refused to rank appear in `excluded` with a reason rather than going silently missing.

        With `seasonal=true` the window is a season instead of the live rolling day. A closed season is frozen and never changes; a running one still moves.
      parameters:
      - name: scope
        in: query
        required: true
        description: which population to rank
        schema:
          $ref: '#/components/schemas/LeaderboardScope'
      - name: chain
        in: query
        required: false
        description: chain slug or id; required for `scope=protocols`
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - name: chains
        in: query
        required: false
        description: comma-separated chain slugs or ids to include; used by `scope=chains`
        schema:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ChainSlug'
        style: form
        explode: false
      - name: seasonal
        in: query
        required: false
        description: rank the season window instead of the live rolling board
        schema:
          type: boolean
      - name: season
        in: query
        required: false
        description: season number; omit or `0` with `seasonal=true` for the season now running
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 50
      - $ref: '#/components/parameters/AcceptPayment'
      - $ref: '#/components/parameters/PaymentSignature'
