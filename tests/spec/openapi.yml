          maxLength: 512
        deployer:
          $ref: '#/components/schemas/DeployerCard'
    OraclePrice:
      type: object
      required:
      - id
      - price
      - conf
      - publish_time
      properties:
        id:
          description: the feed id, 64 hex characters without `0x`
          type: string
        price:
          description: exact decimal of the published fixed-point price
          $ref: '#/components/schemas/DecimalString'
        conf:
          description: confidence interval, same units as `price`
          $ref: '#/components/schemas/DecimalString'
        ema_price:
          $ref: '#/components/schemas/DecimalString'
        publish_time:
          description: RFC 3339 UTC
          type: string
    OraclePriceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OraclePrice'
    Address:
      type: string
      description: |
        Chain-native address: EVM hex, TON, Solana, or a Hyperliquid symbol.

        On an EVM chain the `0x` prefix is optional and case is irrelevant — `0xAbC…`, `0XABC…` and
        `abc…` are the same address and all three are accepted. Responses always carry the
        `0x`-prefixed lower-case form. On TON, Solana and Hyperliquid the address is used and
        returned exactly as given, because case and format carry meaning there.
      minLength: 1
      maxLength: 128
    BriefDeployer:
      type: object
      required:
      - address
      - launches
      - rugs
      - status
      properties:
        address:
          $ref: '#/components/schemas/Address'
        launches:
          description: pairs this wallet has launched on this chain
          type: integer
          format: uint32
        rugs:
          description: of those, how many produced a confirmed abuse
          type: integer
          format: uint32
        status:
          $ref: '#/components/schemas/DeployerStatus'
    BriefHolders:
      description: |
        absent when the holder sweep has not reached this token. Nobody holding it and nobody having counted it are different facts, and a zero here would not tell them apart.
      type: object
      required:
      - top10_pct
      - count
      properties:
        top10_pct:
          description: '% of circulating supply held by the ten largest tracked wallets'
          type: number
          format: float64
        count:
          description: wallets holding more than the dust floor
          type: integer
          format: int32
    BriefLiquidity:
      description: |
        both figures, because a locked percentage means nothing without knowing what it is a percentage of. `usd` includes uncollected LP fees; `onchain_usd` is the withdrawable principal.
      type: object
      required:
      - usd
      - onchain_usd
      - locked_pct
      - burned_pct
      properties:
        usd:
          type: number
          format: float64
        onchain_usd:
          type: number
          format: float64
        locked_pct:
          description: '% of LP supply locked in a known locker (0..100)'
          type: number
          format: float64
        burned_pct:
          description: '% of LP supply burned (0..100)'
          type: number
          format: float64
        earliest_unlock_at:
          description: soonest unlock; absent when nothing is locked or no unlock time was read
          type: string
    BriefMarket:
      description: |
        measured on the deepest pool quoting this token, named in `best_pair` — except `price_usd`, which is the token's canonical price across every pool.
      type: object
      required:
      - price_usd
      - volume_24h
      - trades_24h
      - change_24h
      - best_pair
      - dex
      properties:
        price_usd:
          type: number
          format: float64
        volume_24h:
          type: number
          format: float64
        trades_24h:
          type: integer
          format: uint32
        change_24h:
          description: percent change over 24 hours; 0 when no trustworthy price exists, which is not
            a flat market
          type: number
          format: float64
        best_pair:
          $ref: '#/components/schemas/Address'
        dex:
          type: string
    BriefScore:
      type: object
      required:
      - value
      - title
      - signals
      properties:
        value:
          description: 0..100 quality grade
          type: integer
          format: uint32
        title:
          description: human band label
          type: string
        signals:
          description: what the score is made of; `weight` is the penalty each signal subtracts right
            now, and 0 means disclosed without being applied
          type: array
          items:
            $ref: '#/components/schemas/BriefSignal'
    BriefSignal:
      type: object
      required:
      - kind
      - weight
      properties:
        kind:
          $ref: '#/components/schemas/RiskSignalKind'
        weight:
          type: number
          format: float64
    CanonicalTokenStatus:
      type: string
      x-known-values: [unknown, community, verified, scam, honeypot, delisted]
      description: 'canonical token status. Open set. Known values: unknown, community, verified, scam,
        honeypot, delisted.'
    ChainInfo:
      type: object
      required:
      - slug
      - chain_id
      - latest_block
      - block_lag_seconds
      - protocols
      description: a chain this API serves. Only chains that produced a block in the last 24 hours are
        listed.
      properties:
        slug:
          $ref: '#/components/schemas/ChainSlug'
        chain_id:
          type: integer
          format: uint32
        latest_block:
          type: integer
          format: uint64
        block_lag_seconds:
          type: integer
          format: uint32
        syncing:
          type: boolean
          description: the indexer is still catching up to the chain head, so every figure on this
            chain is a partial view of it
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/FactoryType'
        dex_names:
          type: array
          items:
            type: string
        pairs:
          type: integer
          format: int64
        liquidity_usd:
          type: number
          format: double
        volume_24h_usd:
          type: number
          format: double
        min_liquidity_usd:
          type: number
          format: double
          description: liquidity floor below which this chain is not indexed
        display_name:
          type: string
          description: the chain's name for a person; `slug` is the one to send back
        head_block:
          type: integer
          format: uint64
          description: |
            chain head as the indexer last saw it. Absent on a venue polled rather than indexed. Read together with `latest_block`: their difference is how far behind the indexer is, and it is what `syncing` is decided on.
        metrics_stale:
          type: boolean
          default: false
          description: |
            the projection heartbeat for this chain is behind, or was never written at all. Every ranked board on this chain is stale or empty and its LP fee APR is not computed, so a metric sort will drop it — it is the same condition `excluded_chains` reports on a page. A chain that has never had an aggregation writer reports true forever.
        quality_liquidity_usd:
          type: number
          format: double
          description: |
            of `liquidity_usd`, the share held by pairs scoring 70 or above. v2 called this `quality_tvl_usd`.
        txns_24h:
          type: integer
          format: int64
          description: summed 24h transaction count of the ranked pairs
        new_pairs_24h:
          type: integer
          format: int64
          description: |
            tradable pairs created in the last 24h holding at least `min_liquidity_usd` — the count the default screener actually shows. Use `new_pairs_24h_total` for the chain's full emission.
        new_pairs_24h_total:
          type: integer
          format: int64
          description: |
            every tradable pair created in the last 24h that holds any liquidity at all. Wider than `new_pairs_24h` by design: it stays visible when the headline figure is narrowed, so a collapse in indexing is still detectable.
        scams_total:
          type: integer
          format: int64
          description: pairs carrying the scam verdict, all time
        scams_on_pool:
          type: integer
          format: int64
          description: |
            of `scams_total`, the verdicts this chain earned on the pool itself — a confirmed rug, a honeypot, or a sell that returns nothing.
        scams_inherited:
          type: integer
          format: int64
          description: |
            of `scams_total`, pairs that became terminal because one of their token legs was flagged. Nothing was proven about the pool; keep it separate from `scams_on_pool` in any headline.
        scams_24h:
          type: integer
          format: int64
          description: pairs whose scam verdict landed in the last 24h
        deployers_total:
          type: integer
          format: int64
          description: addresses that have launched at least one pair on this chain
        new_deployers_24h:
          type: integer
          format: int64
          description: deployers first seen in the last 24h
        deployer_abusers:
          type: integer
          format: int64
          description: deployers carrying the abuser verdict
        gainer:
          description: the chain's largest 24h gain among the ranked pairs
          $ref: '#/components/schemas/ChainMover'
        loser:
          description: the chain's largest 24h loss among the ranked pairs
          $ref: '#/components/schemas/ChainMover'
        explorer_url:
          type: string
        native_address_format:
          type: string
          enum:
          - evm_hex
          - raw
          description: how addresses are written on this chain
    ChainList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChainInfo'
    ChainMover:
