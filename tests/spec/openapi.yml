    TokenAddress:
      type: string
      description: canonical token deployment address for the selected network, or the native sentinel;
        Hyperliquid token deployments use EVM addresses
      minLength: 1
      maxLength: 128
    TokenBatchItem:
      type: object
      required:
      - chain
      - address
      - found
      description: one resolved reference. `found` is false when the registry holds no canonical token
        for it; the reference is echoed either way so a caller can zip the response back onto its request.
      properties:
        chain:
          $ref: '#/components/schemas/ChainSlug'
        address:
          $ref: '#/components/schemas/TokenAddress'
        found:
          type: boolean
        token:
          $ref: '#/components/schemas/TokenInfo'
    TokenBatchRef:
      type: object
      required:
      - chain
      - address
      properties:
        chain:
          $ref: '#/components/schemas/ChainSlug'
        address:
          $ref: '#/components/schemas/TokenAddress'
    TokenBatchRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/TokenBatchRef'
    TokenBatchResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenBatchItem'
    TokenBrief:
      description: |
        One decision-ready document per token, in a fixed field order and under two kilobytes for a real token.

        Empty blocks are omitted, never null. `holders` is absent until the holder sweep reaches the token; `deployer` is absent when the launch was never attributed to a wallet. Everything else is present for any token this endpoint answers for — a token with no indexed pool is a `404`, not a brief full of zeroes.
      type: object
      required:
      - chain
      - as_of
      - source
      - verdict
      - score
      - liquidity
      - market
      - flags
      properties:
        chain:
          $ref: '#/components/schemas/ChainSlug'
        as_of:
          description: the indexer's own observation time, not this server's clock — a stale value is
            stale data, not a fresh zero
          type: string
        source:
          type: string
        verdict:
          $ref: '#/components/schemas/TokenVerdict'
        score:
          $ref: '#/components/schemas/BriefScore'
        liquidity:
          $ref: '#/components/schemas/BriefLiquidity'
        market:
          $ref: '#/components/schemas/BriefMarket'
        holders:
          $ref: '#/components/schemas/BriefHolders'
        deployer:
          $ref: '#/components/schemas/BriefDeployer'
        flags:
          description: |
            what the indexer observed about the pool, as slugs. Open set. Known values: honeypot, taxed, perp, spot_disabled, uniswap_v4, unresolved_metadata. An absent flag means it was not observed, never that it was ruled out.
          type: array
          items:
            type: string
            maxLength: 64
    TokenCategory:
      type: string
      x-known-values: [unknown, native, default, stablecoin-usd, wrapped, meme]
      description: 'token classification. Open set. Known values: unknown, native, default, stablecoin-usd,
        wrapped, meme.'
    TokenInfo:
      type: object
      required:
      - id
      - slug
      - symbol
      - name
      - status
      - confidence
      - category
      properties:
        id:
          type: string
          format: uuid
