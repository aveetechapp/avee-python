        prev_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` to walk back; absent at the start
        includes:
          $ref: '#/components/schemas/TokenListIncludes'
    TokenPrimaryMarket:
      type: object
      required:
      - chain_id
      - pair_address
      - dex_id
      properties:
        chain_id:
          type: integer
          format: int32
          minimum: 1
        pair_address:
          type: string
        dex_id:
          type: string
        liquidity_usd:
          $ref: '#/components/schemas/NonNegativeDecimalString'
    TokenStatus:
      type: string
      x-known-values: [active, verified, unresolved, scam]
      description: |
        token lifecycle grade. Open set. Known values: active, verified, unresolved, scam. The last two are terminal.
    TokenVerdict:
      description: |
        What the trust oracle holds for one token. `ok` means no block is recorded, never that the token was examined and found clean; `unknown` means nobody looked at all.

        The signature block — `signed_at`, `expires_at`, `signature`, `signer`, `oracle_address` — is present only when there is something to submit on chain. An unknown verdict and a chain with no oracle both arrive without it, rather than with a signed zero.
      type: object
      required:
      - token_address
      - chain
      - chain_id
      - status
      - reasons
      - reason_bits
      properties:
        token_address:
          $ref: '#/components/schemas/Address'
        chain:
          $ref: '#/components/schemas/ChainSlug'
        chain_id:
          type: integer
          format: uint32
        status:
          $ref: '#/components/schemas/VerdictStatus'
        reasons:
          description: slugs of the bits set in `reason_bits`, in bit order
          type: array
          items:
            $ref: '#/components/schemas/ReasonSlug'
        reason_bits:
          description: the bitfield the contract stores; 1 honeypot, 2 unresolved_metadata, 4 duplicate_symbol,
            8 lp_unlocked, 16 owner_can_mint, 32 sell_blocked, 64 high_tax, 128 deployer_rug
          type: integer
          format: uint32
        verdict_at:
          description: when the verdict itself was reached; absent when nobody has evaluated the token
          type: string
        signed_at:
          description: when this response was signed — the value the signature covers
          type: string
        expires_at:
          description: after this the oracle rejects the signature
          type: string
        signature:
          description: 0x-prefixed 65-byte EIP-712 signature
          type: string
        signer:
          type: string
        oracle_address:
          description: the oracle contract this attestation is for; absent when the chain has no oracle
          type: string
    TokenVerdictProof:
      description: |
        the inclusion proof for one token in a published epoch. It proves what was committed to at that epoch and nothing about now; a verdict reached after the epoch closed is not in it.
      type: object
      required:
      - token_address
      - chain
      - chain_id
      - epoch
      - root
      - proof
      - status
      properties:
        token_address:
          $ref: '#/components/schemas/Address'
        chain:
          $ref: '#/components/schemas/ChainSlug'
        chain_id:
          type: integer
          format: uint32
        epoch:
          description: the published epoch this proof is drawn from
          type: integer
          format: uint64
        root:
          description: merkle root committed on chain for that epoch
          type: string
        proof:
          description: the sibling path, ordered leaf to root; empty when the tree holds one leaf
          type: array
          items:
            type: string
        status:
          description: the verdict committed at that epoch, which may differ from the current one
          $ref: '#/components/schemas/VerdictStatus'
    TonTxData:
      type: object
      required:
      - seq_no
      - shard_id
      - work_chain
      properties:
        seq_no:
          type: integer
        shard_id:
          type: integer
        work_chain:
          type: integer
    TradePage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` for the next page; absent on the last page
        prev_cursor:
          type: string
          maxLength: 512
          description: pass as `cursor` to walk back; absent at the start
    Transaction:
      type: object
      required:
      - timestamp
      - hash
      - chain_id
      - tx_type
      - maker_address
      - from_address
      - to_address
      - block_info
      - event_data
      properties:
        timestamp:
          type: string
        hash:
          type: string
        chain_id:
          type: integer
          format: uint32
        maker_address:
          $ref: '#/components/schemas/Address'
        from_address:
          $ref: '#/components/schemas/Address'
        to_address:
          $ref: '#/components/schemas/Address'
        tx_type:
          $ref: '#/components/schemas/TxType'
        block_info:
          type: object
          oneOf:
          - $ref: '#/components/schemas/EthereumTxData'
          - $ref: '#/components/schemas/TonTxData'
        event_data:
          type: object
          oneOf:
          - $ref: '#/components/schemas/SwapEventData'
          - $ref: '#/components/schemas/LiquidityEventData'
    TxType:
      type: string
      default: all
      enum:
      - all
      - buy
      - sell
      - mint
      - burn
      - add_liquidity
      - remove_liquidity
    TxnPairStat:
      type: object
      required:
      - buys
      - sells
      - buy_volume
      - sell_volume
      - buyers
      - sellers
      properties:
        buys:
          type: integer
          format: uint32
        sells:
          type: integer
          format: uint32
        buy_volume:
          type: number
          format: float64
          description: buy-side volume USD for the window (for buy/sell split bars)
        sell_volume:
          type: number
          format: float64
          description: sell-side volume USD for the window
        buyers:
          type: integer
          format: uint32
          description: Unique maker addresses that bought in the window.
        sellers:
          type: integer
          format: uint32
          description: Unique maker addresses that sold in the window.
    TxnTimeframes:
      type: object
      required:
      - m5
      - h1
      - h6
      - h24
      properties:
        m5:
          $ref: '#/components/schemas/TxnPairStat'
        h1:
          $ref: '#/components/schemas/TxnPairStat'
        h6:
          $ref: '#/components/schemas/TxnPairStat'
        h24:
          $ref: '#/components/schemas/TxnPairStat'
    ValueRange:
      type: object
      description: |
        an observed low/high pair with the date each end was reached. The band covers what we have observed, never the chain's whole history — it is only ever recorded from pairs scoring above 40 that are neither scam nor unresolved and carry no `price_unconfirmed` / `reserve_unconfirmed` signal, so it starts when a pair first qualified.
      required:
      - low
      - high
      - low_at
      - high_at
      properties:
        low:
          type: number
          format: float64
        high:
          type: number
          format: float64
        low_at:
          description: unixtime UTC of the block the low was observed in; the first occurrence wins on
            a tie
          type: integer
          format: int64
        high_at:
          description: unixtime UTC of the block the high was observed in
          type: integer
          format: int64
    VerdictStatus:
      type: string
      x-known-values: [ok, watch, blocked, unknown]
      description: |
        block state of a token. Open set. Known values: ok, watch, blocked, unknown. `ok` means the oracle holds no block — it is not a clearance. `unknown` means nobody has evaluated it, and must never be read as "not blocked".
      maxLength: 32
    WalletWindow:
      type: string
      description: rolling window the metrics are computed over
      default: 30d
      enum:
      - 1d
      - 7d
      - 30d
      - 1y
      - all
    WalletSortBy:
      type: string
      description: |
        `total_pnl` ranks on realised profit plus open positions marked to market, so a wallet sitting on a large unrealised gain is not ranked below wallets that merely took profit. `realized_pnl` ranks on taken profit alone. `win_rate` ranks only wallets with enough rated positions for the ratio to carry information. `user_score` ranks on the wallet score.
      default: total_pnl
      enum:
      - total_pnl
      - realized_pnl
      - volume
      - win_rate
      - trades
      - user_score
    PositionSortBy:
      type: string
      description: |
        `token` is the stable address order used for plain listing. `hold` measures first buy to last sell, so it is only meaningful on closed positions. Every value sort runs descending.
      default: token
      enum:
      - token
      - realized_pnl
      - unrealized_pnl
      - hold
    PositionState:
      type: string
      default: any
      enum:
      - any
      - open
      - closed
    WalletTier:
      type: string
      description: capital tier. Open set.
      maxLength: 32
    WalletType:
      type: string
      description: |
        What is at the keyboard, as a closed set safe to switch on. `robot` when the wallet carries an automation label, `human` when a known trading rhythm clears the human floor, `unknown` when there is not enough evidence either way — never `robot` by elimination. It does not depend on the deployment serving scores.
      enum:
      - unknown
      - human
      - robot
    WalletLabel:
      type: object
      required:
      - kind
      - name
      - confidence
      properties:
        kind:
          type: integer
          format: uint32
        name:
          type: string
        confidence:
          type: number
          format: double
        token_address:
          $ref: '#/components/schemas/Address'
    UserScore:
      type: object
      required:
      - value
      - status
      description: |
        One number, 0-100: an ordinary user with no manipulative behaviour in trading or deploying, and evidence that they trade well. Absent while the deployment serves no scores. `status` separates a withheld score from a judged zero — a wallet with too few closed rounds or too little deployed capital is `unknown`, not bad.
      properties:
        value:
          type: integer
          format: uint32
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
          - unknown
          - rated
          - excluded
    ScammerScore:
      type: object
      required:
      - value
      - band
      description: absent while the deployment serves no scores
      properties:
        value:
          type: integer
          format: uint32
          minimum: 0
          maximum: 100
        band:
          type: string
          enum:
          - none
          - low
          - suspect
          - abuser
    WalletScoreSignal:
      type: object
      required:
      - kind
      - direction
      - target
      description: |
        One reason behind a wallet's scores. `direction` says what the reason did: `credit` and `penalty` move the trader score up and down, `abuse` builds the scammer score, and `ceiling` is a cap the wallet cannot rate above however well it trades. `points` is the size of that move on the 0-100 scale, or the value of the cap when the direction is `ceiling`.
      properties:
        kind:
          type: string
          description: stable identifier, safe to switch on. Open set.
          maxLength: 64
        title:
          type: string
          description: the reason in a reader's words
        detail:
          type: string
        subject:
          type: string
          description: the address or label the reason points at, when it points at one
        points:
          type: number
          format: double
        occurrences:
          type: integer
          format: uint32
          description: how many rounds, pairs or events the reason was drawn from
        last_seen:
          type: string
        direction:
          type: string
          description: Open set.
          maxLength: 32
        target:
          type: string
          description: Open set.
          maxLength: 32
    WalletMetrics:
      type: object
      required:
      - window
      properties:
        window:
          $ref: '#/components/schemas/WalletWindow'
        realized_pnl_usd:
          type: number
          format: double
        unrealized_pnl_usd:
          type: number
          format: double
        total_pnl_usd:
          type: number
          format: double
        rated_pnl_usd:
          description: realised PNL from positions with an observed cost basis; the board ranks on it
          type: number
          format: double
        gross_profit_usd:
          type: number
          format: double
        gross_loss_usd:
          type: number
          format: double
        invested_usd:
          type: number
          format: double
        volume_usd:
          type: number
          format: double
        roi:
          type: number
          format: double
        win_rate:
          description: |
            Share of closed positions that ended in profit, over positions whose cost basis was actually observed. Absent when `rated_positions` is 0, because there is no sample to rate — a 0 there would read as a verdict.
          type: number
          format: double
        trade_win_rate:
          description: |
            Share of individual closing trades that ended in profit. Defined wherever the wallet has any closed trade at all, so it stays meaningful on wallets `win_rate` cannot rate.
          type: number
          format: double
        median_roi:
          type: number
          format: double
        profit_factor:
          type: number
          format: double
        avg_trade_usd:
          type: number
          format: double
        avg_hold_seconds:
          type: integer
          format: int64
        trades:
          type: integer
          format: uint32
        winning_trades:
          type: integer
          format: uint32
        losing_trades:
          type: integer
          format: uint32
        tokens_traded:
          type: integer
          format: uint32
        closed_positions:
          type: integer
          format: uint32
        open_positions:
          type: integer
          format: uint32
        rated_positions:
          description: |
            Closed positions with an observed cost basis and a non-zero outcome. This is the sample `win_rate` is computed over; when it is 0 the win rate is absent rather than zero.
          type: integer
          format: uint32
        excluded_transfer_only:
          description: positions the wallet never traded, only received or sent
          type: integer
          format: uint32
        excluded_untracked:
          description: positions whose tokens arrived from a source the indexer could not attribute
          type: integer
          format: uint32
        excluded_no_outcome:
          description: closed positions that ended exactly flat, so they rate neither win nor loss
          type: integer
          format: uint32
    WalletProfile:
      type: object
      required:
      - address
      - chain
      properties:
        address:
          $ref: '#/components/schemas/Address'
        chain:
          $ref: '#/components/schemas/ChainRef'
        tier:
