    RiskSignalGroup:
      type: string
      description: |
        the question this signal answers for a holder. Six buckets, worst outcome first, so a client can render six rows instead of one per kind. `kind` is an open set and this is not: a kind nobody has classified yet is published as `unverified`, never as an empty string.
      enum:
