          type: boolean
        rebuild_skipped:
          description: |
            Whether we deliberately do not compute trading history for this wallet. True means the zeroes below are a decision, not a gap: the wallet is classified as machinery nobody can copy.
          type: boolean
        rebuild_skip_reason:
          description: the classification that decided it, drawn from the wallet label vocabulary
          type: string
