    ReasonSlug:
      type: string
      x-known-values: [honeypot, unresolved_metadata, duplicate_symbol, lp_unlocked, owner_can_mint, sell_blocked, high_tax, deployer_rug]
      description: |
        why a verdict was reached. Open set. Known values, in bit order: honeypot, unresolved_metadata, duplicate_symbol, lp_unlocked, owner_can_mint, sell_blocked, high_tax, deployer_rug. An absent reason means it was not measured, never that the token is clear of it.
      maxLength: 64
    ResolutionType:
      type: string
      description: Available chart resolutions
      enum:
      - '1'
      - '3'
      - '5'
      - '15'
      - '30'
      - '45'
      - 1H
      - 2H
      - 4H
      - 6H
      - 12H
      - 1D
      - 1W
      - 1M
      - 6M
      - 1Y
    RiskSignal:
      type: object
      required:
      - kind
      - weight
      - group
      - severity
      properties:
        kind:
          $ref: '#/components/schemas/RiskSignalKind'
        weight:
          description: penalty weight this signal contributes
          type: number
          format: float64
        group:
